# Архітектурні правила — окремий workflow, щоб не чіпати назви jobs у ci.yml (на них спирається ruleset).
# Кожне правило — швидкий скрипт без залежностей; правила вигляду — DESIGN.md.
name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-tokens:
    name: "Дизайн-система: лише токени"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-design-tokens.mjs

  auth-boundary:
    # Межа доступу (docs/decisions/0001-auth-boundary.md): RLS і revoke на таблицях public, security definer лише в
    # private, getPageAccess / getCurrentUser до запитів даних, без getSession і middleware.ts.
    name: "Межа доступу: RLS, private і getClaims"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-auth-boundary.mjs
